build: bash scripts/box-build.sh
source: false
artifacts: [.box]
services:
  web:
    command: sh .box/run.sh
    env:
      SLATE_STORAGE: sql
      # Private deployment: Amp's gate admits only the owner. Switch to amp
      # once a Sign in with Amp client exists.
      SLATE_AUTH: gate
      LOG_LEVEL: INFO
