[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "slate"
version = "0.1.0"
description = "Personal task manager replacing Linear and Todoist"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
    { name = "mattjmcnaughton", email = "mattjmcnaughton@gmail.com" },
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "structlog>=24.0",
    "pydantic-settings>=2.0",
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.13",
    "aiosqlite>=0.20",
    "python-dateutil>=2.9",
    "httpx>=0.27",
    "itsdangerous>=2.2",
]

[project.optional-dependencies]
postgres = ["asyncpg>=0.30"]

[project.urls]
Repository = "https://github.com/mattjmcnaughton/slate"

[tool.uv]
exclude-newer = "1 week"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
    "ty>=0.0.1",
    "pytest-asyncio>=0.24",
    "asyncpg>=0.30",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "A", "SIM", "TCH"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "external: tests that hit external services",
    "postgres: tests that need a Postgres server (TEST_POSTGRES_URL)",
]
